[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge"
dynamic = ["version"]
description = "Authorized network reconnaissance foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReconForge contributors" }]
dependencies = []

[project.scripts]
reconforge = "reconforge.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reconforge.__version__" }

[tool.setuptools.packages.find]
include = ["reconforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
